name: SUT Management

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: 'Select Runner OS'
        type: choice
        options:
          - ubuntu-latest
          - CentOS-latest
        default: 'ubuntu-latest'
        required: true
      
      action:
        description: 'Action to perform'
        type: choice
        options:
          - add_sut
          - delete_sut
          - list_suts
          - update_sut
          - test_connectivity
        default: 'list_suts'
        required: true
      
      sut_name:
        description: 'SUT Name (required for add/delete/update/test)'
        required: false
        type: string
        default: ''
      
      sut_host:
        description: 'SUT Host/IP Address (required for add/update)'
        required: false
        type: string
        default: ''
        
      sut_port:
        description: 'SSH Port (default: 22)'
        required: false
        type: string
        default: '22'
      
      sut_username:
        description: 'SSH Username (required for add/update)'
        required: false
        type: string
        default: ''
      
      sut_password:
        description: '⚠️ SSH Password (will be stored as secret - use for initial setup only)'
        required: false
        type: string
        default: ''
      
      auth_method:
        description: 'Authentication Method'
        type: choice
        options:
          - password
          - ssh_key
          - both
        default: 'password'
        required: false      
        
      sut_description:
        description: 'SUT Description (optional)'
        required: false
        type: string
        default: ''
      
      cpu_family:
        description: 'CPU Family (for add/update)'
        type: choice
        options:
          - GNR-AP
          - SRF-SP
          - SRF-AP
          - CWF-AP
          - Generic
        default: 'Generic'
        required: false
      
      os_type:
        description: 'Operating System (for add/update)'
        type: choice
        options:
          - Linux
          - Windows
          - Unknown
        default: 'Linux'
        required: false
      
      labels:
        description: 'Runner Labels (comma-separated, for add/update)'
        required: false
        type: string
        default: 'self-hosted,linux'

env:
  PYTHON_VERSION: '3.10'

jobs:
  manage-sut:
    runs-on: ${{ github.event.inputs.runner_os }}
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    # OS Detection and Info
    - name: Display OS Information
      run: |
        echo "🖥️  Runner OS: ${{ github.event.inputs.runner_os }}"
        echo "📋 System Information:"
        if [ -f /etc/os-release ]; then
          cat /etc/os-release
        elif [ -f /etc/redhat-release ]; then
          cat /etc/redhat-release
        else
          uname -a
        fi
    
    # Setup Python - Ubuntu
    - name: Setup Python - Ubuntu
      if: github.event.inputs.runner_os == 'ubuntu-latest'
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    # Setup Python - CentOS
    - name: Setup Python - CentOS
      if: github.event.inputs.runner_os == 'CentOS-latest'
      run: |
        echo "🔧 Setting up Python on CentOS..."
        
        if command -v python3.10 &> /dev/null; then
          echo "✅ Python 3.10 already installed"
          python3.10 --version
        elif command -v python3 &> /dev/null; then
          echo "✅ Using available Python 3"
          python3 --version
          sudo ln -sf $(which python3) /usr/local/bin/python3.10 || true
        else
          echo "📦 Installing Python 3..."
          sudo yum update -y || sudo dnf update -y
          sudo yum install -y python3 python3-pip || sudo dnf install -y python3 python3-pip
          python3 --version
        fi
        
        python3 -m pip install --user --upgrade pip || pip3 install --user --upgrade pip
    
    # Install dependencies - Ubuntu
    - name: Install dependencies - Ubuntu
      if: github.event.inputs.runner_os == 'ubuntu-latest'
      run: |
        echo "📦 Installing Python dependencies on Ubuntu..."
        python -m pip install --upgrade pip
        pip install pyyaml requests tabulate paramiko cryptography
    
    # Install dependencies - CentOS
    - name: Install dependencies - CentOS
      if: github.event.inputs.runner_os == 'CentOS-latest'
      run: |
        echo "📦 Installing Python dependencies on CentOS..."
        
        if command -v python3.10 &> /dev/null; then
          PYTHON_CMD="python3.10"
        elif command -v python3 &> /dev/null; then
          PYTHON_CMD="python3"
        else
          echo "❌ No Python 3 found"
          exit 1
        fi
        
        $PYTHON_CMD -m pip install --user --upgrade pip
        $PYTHON_CMD -m pip install --user pyyaml requests tabulate paramiko cryptography
        
        # Verify installations
        $PYTHON_CMD -c "import yaml, requests, tabulate, paramiko; print('✅ All dependencies installed successfully')"
    
    # Create directories
    - name: Ensure directories exist
      run: |
        mkdir -p scripts config .ssh-keys
        echo "📁 Directory structure created"
    
    # Store SUT password as secret (if provided)
    - name: Store SUT Credentials as Secret
      if: github.event.inputs.action == 'add_sut' && github.event.inputs.sut_password != ''
      run: |
        echo "🔐 Storing SUT credentials as repository secret..."
        
        # Create secret name based on SUT name
        SECRET_NAME="SUT_PASSWORD_$(echo '${{ github.event.inputs.sut_name }}' | tr '[:lower:]' '[:upper:]' | tr '-' '_')"
        
        echo "Secret will be stored as: $SECRET_NAME"
        echo "⚠️  Note: You'll need to manually add this secret in repository settings:"
        echo "   Settings → Secrets and variables → Actions → New repository secret"
        echo "   Name: $SECRET_NAME"
        echo "   Value: [the password you entered]"
        echo ""
        echo "🔒 For security, the password is not automatically stored via API"
    
    # Run SUT Management - Ubuntu
    - name: Run SUT Management - Ubuntu
      if: github.event.inputs.runner_os == 'ubuntu-latest'
      run: |
        echo "🚀 Running SUT Management on Ubuntu..."
        python scripts/sut_manager.py \
          --action "${{ github.event.inputs.action }}" \
          --sut-name "${{ github.event.inputs.sut_name }}" \
          --sut-host "${{ github.event.inputs.sut_host }}" \
          --sut-port "${{ github.event.inputs.sut_port }}" \
          --sut-username "${{ github.event.inputs.sut_username }}" \
          --auth-method "${{ github.event.inputs.auth_method }}" \
          --sut-description "${{ github.event.inputs.sut_description }}" \
          --cpu-family "${{ github.event.inputs.cpu_family }}" \
          --os-type "${{ github.event.inputs.os_type }}" \
          --labels "${{ github.event.inputs.labels }}" \
          --sudo-required "${{ github.event.inputs.sudo_required }}" \
          --github-token "${{ secrets.GITHUB_TOKEN }}" \
          --repo "${{ github.repository }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # Run SUT Management - CentOS
    - name: Run SUT Management - CentOS
      if: github.event.inputs.runner_os == 'CentOS-latest'
      run: |
        echo "🚀 Running SUT Management on CentOS..."
        
        if command -v python3.10 &> /dev/null; then
          PYTHON_CMD="python3.10"
        elif command -v python3 &> /dev/null; then
          PYTHON_CMD="python3"
        else
          echo "❌ No Python 3 found"
          exit 1
        fi
        
        export PATH="$HOME/.local/bin:$PATH"
        
        $PYTHON_CMD scripts/sut_manager.py \
          --action "${{ github.event.inputs.action }}" \
          --sut-name "${{ github.event.inputs.sut_name }}" \
          --sut-host "${{ github.event.inputs.sut_host }}" \
          --sut-port "${{ github.event.inputs.sut_port }}" \
          --sut-username "${{ github.event.inputs.sut_username }}" \
          --auth-method "${{ github.event.inputs.auth_method }}" \
          --sut-description "${{ github.event.inputs.sut_description }}" \
          --cpu-family "${{ github.event.inputs.cpu_family }}" \
          --os-type "${{ github.event.inputs.os_type }}" \
          --labels "${{ github.event.inputs.labels }}" \
          --sudo-required "${{ github.event.inputs.sudo_required }}" \
          --github-token "${{ secrets.GITHUB_TOKEN }}" \
          --repo "${{ github.repository }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # Test SSH Connection (if requested)
    - name: Test SSH Connection
      if: github.event.inputs.action == 'test_ssh_connection'
      run: |
        echo "🔌 Testing SSH connection to SUT..."
        
        # Get the appropriate Python command
        if command -v python3.10 &> /dev/null; then
          PYTHON_CMD="python3.10"
        elif command -v python3 &> /dev/null; then
          PYTHON_CMD="python3"
        elif command -v python &> /dev/null; then
          PYTHON_CMD="python"
        else
          echo "❌ No Python found"
          exit 1
        fi
        
        # Test SSH connection using the SUT manager
        $PYTHON_CMD scripts/sut_manager.py \
          --action "test_ssh_connection" \
          --sut-name "${{ github.event.inputs.sut_name }}"
    
    # Commit SUT configuration changes
    - name: Commit SUT configuration changes
      if: github.event.inputs.action == 'add_sut' || github.event.inputs.action == 'delete_sut' || github.event.inputs.action == 'update_sut'
      run: |
        echo "💾 Committing SUT configuration changes..."
        
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add config/suts.yaml
        
        if git diff --staged --quiet; then
          echo "ℹ️  No changes to commit"
        else
          echo "📝 Committing changes..."
          git commit -m "SUT Management: ${{ github.event.inputs.action }} - ${{ github.event.inputs.sut_name }} [by ${{ github.actor }}]"
          git push
          echo "✅ Changes committed and pushed successfully"
        fi
    
    # Security reminder
    - name: Security Reminder
      if: github.event.inputs.action == 'add_sut' && github.event.inputs.sut_password != ''
      run: |
        echo ""
        echo "🔐 SECURITY REMINDER:"
        echo "===================="
        echo "1. Manually add the SUT password as a repository secret:"
        echo "   - Go to Settings → Secrets and variables → Actions"
        echo "   - Click 'New repository secret'"
        echo "   - Name: SUT_PASSWORD_$(echo '${{ github.event.inputs.sut_name }}' | tr '[:lower:]' '[:upper:]' | tr '-' '_')"
        echo "   - Value: [the password you entered]"
        echo ""
        echo "2. Consider using SSH keys instead of passwords for better security"
        echo "3. Ensure the SUT user has appropriate permissions for test execution"
        echo ""
    
    # Display final status
    - name: Display Final Status
      if: always()
      run: |
        echo ""
        echo "🎯 SUT Management Summary:"
        echo "=========================="
        echo "Action: ${{ github.event.inputs.action }}"
        echo "SUT Name: ${{ github.event.inputs.sut_name }}"
        echo "SUT Host: ${{ github.event.inputs.sut_host }}"
        echo "Username: ${{ github.event.inputs.sut_username }}"
        echo "Auth Method: ${{ github.event.inputs.auth_method }}"
        echo "Runner OS: ${{ github.event.inputs.runner_os }}"
        echo "Executed by: ${{ github.actor }}"
        echo "Status: ${{ job.status }}"
        fi
