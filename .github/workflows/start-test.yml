name: Customer Workload Runner
run-name: Start Customer test on ${{ github.event.inputs.sut_name }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:

      sut_name:
        description: 'SUT name'
        # Default value if no value is explicitly provided
        default: 'unknown'
        # Input has to be provided for the workflow to run
        required: true

      cpu_family:
        description: 'CPU family for packaging the name with it when done.'
        type: choice
        options:
          - GNR-AP
          - SRF-SP
          - SRF-AP
          - CWF-AP
          - Generic
        default: 'Generic'
        required: true
        
      cpu_qdf:
        description: 'CPU QDF/SKU'
        default: 'Generic'
        required: true
      
      customer_name:
        # Customer name to filter test plan
        description: 'Customer name for different test schemas per customer interests.'
        type: choice
        options:
          - META
          - Bytedance
          - Alibaba
          - Generic
        default: 'Generic'
        required: true

      need_upstream:
        # Switch to enable/disable upstream the output
        description: 'Upload output results to database'
        type: boolean
        # Default value if no value is explicitly provided
        default: 'false'
        # Input has to be provided for the workflow to run
        required: true
      
      test_cases:
        description: 'Select test case to run'
        type: choice
        options:
          - Core_Scaling
          - Module_Scaling
          - Frequency_Scaling
          - Per_Core_Scaling
          - all_tests
        default: 'Core_Scaling'
        required: true

      metric_collection:
        description: 'Select metric to be collected'
        type: choice
        options:
          - Emon
          - Ptat
          - sar
          - Perf_top
          - None
          - all
        default: 'None'
        required: true
        
      workload_list:
        # Workload list file for workflow to run WL tests
        description: 'Input the Workload ID separated by comma, e.g. 0,1,2 Options: [0:MLC 1:Mediawiki 2:Feedsim 3:VideoTranscode]'
        default: '0'
        # Input has to be provided for the workflow to run
        required: true
env:
  PYTHON_VERSION: '3.10'

jobs:
  run-tests:
    # The type of runner that the job will run on
    runs-on: ${{ github.event.inputs.sut_name }}
    # Configure execution timeout 960 minutes (16 hrs)
    timeout-minutes: 960
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          fetch-depth: 1

    ##################################################################################
    #####                           Linux Tasks                                  #####
    ##################################################################################
    # Determine base path directory
    - name: Determine base path directory - Linux
      if: runner.os == 'Linux'
      run: |
           base_path=$(cat /opt/.cloud_pnp_test_path || echo /root/);
           echo "BASE_PATH=$base_path" >> $GITHUB_ENV;

    - name: Print Input Parameters and Env - Linux
      if: runner.os == 'Linux'
      run: |
           echo sut_name:           ${{ github.event.inputs.sut_name }};
           echo base_path:          ${BASE_PATH};
           echo cpu_family:         ${{ github.event.inputs.cpu_family }};
           echo cpu_qdf:            ${{ github.event.inputs.cpu_qdf }};
           echo customer_name:      ${{ github.event.inputs.customer_name }};
           echo workload_list:      ${{ github.event.inputs.workload_list }};
           echo need_upstream:      ${{ github.event.inputs.need_upstream }};
           echo test_cases:         ${{ github.event.inputs.test_cases }};
           echo metric_collection:  ${{ github.event.inputs.metric_collection}};
           echo git_branch:         ${GITHUB_REF##*/};
           echo github_actor:       ${{ github.actor }};

    # Display disk partition usage
    - name: Local disk space info - Linux
      if: runner.os == 'Linux'
      run: |
           available_space=$(df -hl ${BASE_PATH} | grep -v Filesystem | awk '{print $4}');
           echo Base Path ${BASE_PATH} partition available space - ${available_space};
           echo
           echo Print all disk partitions;
           df -hl;

    - name: Prepare Customer-workspace - Linux
      if: runner.os == 'Linux'
      run: rm -rf ${BASE_PATH}/Customer-workspace;
           cp -r $GITHUB_WORKSPACE ${BASE_PATH}/Customer-workspace;

    - name: Create output folder - Linux
      if: runner.os == 'Linux'
      run: |
           if [ ! -d ${BASE_PATH}/Customer-workspace/output ]; then
             mkdir -p ${BASE_PATH}/Customer-workspace/output;
           fi

    - name: Run version_check.py script - Linux
      if: runner.os == 'Linux'
      run: |
           cd ${BASE_PATH}/Customer-workspace;
           python version_check.py;

    - name: Install dependencies from requirements.txt - Linux
      if: runner.os == 'Linux'
      run: |
           python --version
           python -m pip install -r ${GITHUB_WORKSPACE}/requirements.txt --proxy=http://proxy-dmz.intel.com:912 || echo "WARNING: Could not install python requirements.txt"

    - name: System CPU Info - Linux
      if: runner.os == 'Linux'
      run: lscpu;

    - name: System BIOS Info - Linux
      if: runner.os == 'Linux'
      run: dmidecode -t bios;

    - name: System Memory Info - Linux
      if: runner.os == 'Linux'
      run: dmidecode -t memory;

    - name: Run start-test.py script to run Customer workloads - Linux
      if: runner.os == 'Linux'
      run: |
           cd ${BASE_PATH}/Customer-workspace;
           python start-test.py \
           --sut_name ${{ github.event.inputs.sut_name }} \
           --base_path ${BASE_PATH} \
           --Customer_work_dir ${BASE_PATH}/Customer-workspace \
           --cpu_family ${{ github.event.inputs.cpu_family }} \
           --cpu_qdf ${{ github.event.inputs.cpu_qdf }} \
           --customer ${{ github.event.inputs.customer_name }} \
           --workload_list ${{ github.event.inputs.workload_list }} \
           --test_cases ${{ github.event.inputs.test_cases }} \
           --metric_collection ${{ github.event.inputs.metric_collection }} \
           --upload_results_to_db ${{ github.event.inputs.need_upstream }} \
           --db_host ${{ secrets.DB_HOST }} \
           --db_port ${{ secrets.DB_PORT }} \
           --db_name ${{ secrets.DB_NAME }} \
           --db_user ${{ secrets.DB_USER }} \
           --db_pwd ${{ secrets.DB_PASSWORD }};
      working-directory: ${{ env.BASE_PATH }}
      env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload log files as artifacts - Linux
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: |
          ${{ env.BASE_PATH }}/Customer-workspace/log/*.log
          ${{ env.BASE_PATH }}/Customer-workspace/output/*
