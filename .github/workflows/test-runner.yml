name: Python Test Case Runner

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: 'Select test case to run'
        required: true
        default: 'test_case_1'
        type: choice
        options:
          - test_case_1
          - test_case_2
          - test_case_3
          - test_case_4
          - test_case_5
          - test_case_6
          - all_tests
      
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - development
      
      sut_host:
        description: 'SUT Host IP/Domain (optional - uses default if empty)'
        required: false
        type: string
        default: ''
      
      additional_params:
        description: 'Additional parameters (JSON format, optional)'
        required: false
        type: string
        default: '{}'

env:
  PYTHON_VERSION: '3.11'

jobs:
  run-tests:
    runs-on: [self-hosted, linux]
    timeout-minutes: 60
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Setup test environment
      run: |
        python scripts/setup_environment.py \
          --test-case "${{ github.event.inputs.test_case }}" \
          --environment "${{ github.event.inputs.environment }}" \
          --sut-host "${{ github.event.inputs.sut_host }}" \
          --additional-params '${{ github.event.inputs.additional_params }}' \
          --actor "${{ github.actor }}"
    
    - name: Run test execution
      run: |
        python scripts/test_runner.py \
          --test-case "${{ github.event.inputs.test_case }}" \
          --environment "${{ github.event.inputs.environment }}" \
          --sut-host "${{ github.event.inputs.sut_host }}" \
          --additional-params '${{ github.event.inputs.additional_params }}' \
          --actor "${{ github.actor }}"
      continue-on-error: true
    
    - name: Generate test summary and reports
      if: always()
      run: |
        python scripts/generate_summary.py \
          --test-case "${{ github.event.inputs.test_case }}" \
          --environment "${{ github.event.inputs.environment }}" \
          --actor "${{ github.actor }}"
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_number }}
        path: |
          test_results/
          reports/
        retention-days: 30
    
    - name: Upload test reports to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./reports
        destination_dir: test-reports/${{ github.run_number }}
    
    - name: Comment PR with results
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = './test_results/summary.md';
          if (fs.existsSync(path)) {
            const summary = fs.readFileSync(path, 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
          }
